<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-theme="light">

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title">💰 Budget Tracker</h1>
    <button id="themeToggle" class="btn-icon" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
      🌙
    </button>
  </header>

  <main class="container">

    <!-- Balance Card -->
    <section class="balance-card" aria-label="Total balance">
      <p class="balance-label">Total Balance</p>
      <h2 class="balance-amount" id="totalBalance">Rp 0</h2>
    </section>

    <!-- Spending Limit Alert -->
    <div id="limitAlert" class="limit-alert hidden" role="alert">
      ⚠️ Warning: Your spending has exceeded the set limit!
    </div>

    <!-- Input Form -->
    <section class="card" aria-label="Add transaction">
      <h2 class="section-title">Add Transaction</h2>
      <form id="transactionForm" novalidate>
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input
            type="text"
            id="itemName"
            placeholder="e.g. Lunch, Bus fare..."
            autocomplete="off"
            maxlength="60"
          />
          <span class="field-error" id="itemNameError"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount (Rp)</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g. 15000"
            min="1"
          />
          <span class="field-error" id="amountError"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select Category --</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Fun">🎮 Fun</option>
            <!-- Custom categories will be appended here dynamically -->
          </select>
          <span class="field-error" id="categoryError"></span>
        </div>

        <!-- Add Custom Category -->
        <details class="custom-category-toggle">
          <summary>+ Add custom category</summary>
          <div class="custom-category-form">
            <input
              type="text"
              id="customCategoryInput"
              placeholder="e.g. Health, Shopping..."
              maxlength="30"
            />
            <button type="button" id="addCustomCategory" class="btn btn-secondary">Add</button>
          </div>
          <span class="field-error" id="customCategoryError"></span>
        </details>

        <!-- Spending Limit -->
        <div class="form-group">
          <label for="spendingLimit">Spending Limit (Rp) <span class="optional">(optional)</span></label>
          <input
            type="number"
            id="spendingLimit"
            placeholder="e.g. 500000"
            min="0"
          />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Add Transaction</button>
      </form>
    </section>

    <!-- Sort Controls -->
    <section class="card" aria-label="Transaction history">
      <div class="list-header">
        <h2 class="section-title">Transactions</h2>
        <div class="sort-controls">
          <label for="sortSelect" class="sort-label">Sort:</label>
          <select id="sortSelect" aria-label="Sort transactions">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="amount-desc">Amount ↓</option>
            <option value="amount-asc">Amount ↑</option>
            <option value="category">By Category</option>
          </select>
        </div>
      </div>

      <!-- Transaction List -->
      <ul id="transactionList" class="transaction-list" aria-label="List of transactions">
        <!-- Items injected by JS -->
      </ul>
      <p id="emptyState" class="empty-state">No transactions yet. Add one above!</p>
    </section>

    <!-- Pie Chart -->
    <section class="card chart-card" aria-label="Spending by category">
      <h2 class="section-title">Spending by Category</h2>
      <div class="chart-wrapper">
        <canvas id="spendingChart" aria-label="Pie chart of spending by category" role="img"></canvas>
      </div>
      <p id="chartEmpty" class="empty-state hidden">No data to display yet.</p>
    </section>

  </main>

  <footer class="app-footer">
    <p>Built with ❤️ · Budget Tracker</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
